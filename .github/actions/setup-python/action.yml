name: "Setup Python & ZenOS Dependencies"
description: "Configures Python with uv caching and installs ZenOS dependencies"

inputs:
  python-version:
    description: "Python version to use"
    required: false
    default: "3.13"
  cache-dependency-path:
    description: "Path to dependency files for cache key"
    required: false
    default: "requirements*.txt"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: "pip"
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Install uv for fast dependency resolution
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: ${{ inputs.cache-dependency-path }}

    - name: Install Python Dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        uv pip install --system -r requirements.txt -r requirements-dev.txt
