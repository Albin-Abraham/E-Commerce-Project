version: 2
updates:
  # Maintain dependencies for Python backend
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    target-branch: "development"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(python)"

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    target-branch: "development"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "deps(actions)"
