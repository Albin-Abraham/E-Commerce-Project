name: ZenOS CI Quality Pipeline

on:
  push:
    branches: [main, development, feat-shop-module, feat-gitworkflows-actions]
  pull_request:
    branches: [main, development, feat-shop-module, feat-gitworkflows-actions]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-architecture:
    name: Quality & Architecture Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python & Dependencies
        uses: ./.github/actions/setup-python

      - name: Run ZenOS Quality Orchestrator (CI Profile)
        run: |
          ./tools/quality/orchestrator/check.sh ci

  django-system-and-migrations:
    name: Django System Check & Migration Graph
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python & Dependencies
        uses: ./.github/actions/setup-python

      - name: Run Django System Check
        run: |
          python manage.py check --settings=backend.settings.test

      - name: Verify Migration Graph Consistency
        run: |
          python manage.py showmigrations --settings=backend.settings.test

  test-suite:
    name: Pytest Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality-and-architecture, django-system-and-migrations]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python & Dependencies
        uses: ./.github/actions/setup-python

      - name: Run Domain & Fast Unit Tests
        run: |
          pytest tests/domain/

      - name: Run Core & Permissions Test Suite
        run: |
          pytest tests/ --reuse-db

  docker-build-smoke:
    name: Docker Container Build Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image (Smoke Test)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: zenos-backend:smoke-test
