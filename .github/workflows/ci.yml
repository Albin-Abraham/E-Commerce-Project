name: CI Quality Pipeline

on:
  push:
    branches: [main, development, feat-shop-module]
  pull_request:
    branches: [main, development, feat-shop-module]

jobs:
  lint-and-architectural-integrity:
    name: Lint & Architectural DAG Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verify Architectural Layered DAG
        run: |
          python scripts/check_import_dag.py

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Verify Ruff Code Formatting
        run: |
          ruff format --check .

  django-system-and-migrations:
    name: Django System Check & Migration Graph
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Django System Check
        run: |
          python manage.py check --settings=backend.settings.test

      - name: Verify Migration Graph Consistency
        run: |
          python manage.py showmigrations --settings=backend.settings.test

  test-suite:
    name: Pytest Test Suite
    runs-on: ubuntu-latest
    needs: [lint-and-architectural-integrity, django-system-and-migrations]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Domain & Fast Unit Tests
        run: |
          pytest tests/domain/

      - name: Run Core & Permissions Test Suite
        run: |
          pytest tests/ --reuse-db
