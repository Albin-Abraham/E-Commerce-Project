repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: zenos-quality-pre-commit
        name: ZenOS Quality & Architecture Checks
        entry: ./tools/quality/orchestrator/check.sh pre_commit
        language: system
        pass_filenames: false
        always_run: true
