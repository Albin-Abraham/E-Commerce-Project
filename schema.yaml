        Retrieve a single company record.

        ---

        ## ⚙️ View Configuration

        **View ID:** `CORE_COMPANY_MGMT`
      summary: GET Company
      parameters:
      - in: header
        name: Is-Select-Option
        schema:
          type: boolean
        description: Return only ID and None using select_serializer_class (skips
          pagination)
      - in: query
        name: code
        schema:
          type: string
        description: Filter by code
      - in: query
        name: email
        schema:
          type: string
        description: Filter by email
      - in: query
        name: export
        schema:
          type: string
          enum:
          - csv
          - excel
          - pdf
        description: Export format (e.g., 'csv', 'excel', 'pdf')
      - in: query
        name: fields
        schema:
          type: string
        description: Comma-separated list of fields to include in response or export
      - in: query
        name: ids
        schema:
          type: string
        description: Comma-separated list of IDs to include (Bulk Selection)
      - in: query
        name: include_ids
        schema:
          type: string
        description: Comma-separated list of IDs to always include in select results
          (ignored if search is active)
      - in: query
        name: name
        schema:
          type: string
        description: Filter by name
      - in: query
        name: page
        schema:
          type: integer
        description: A page number within the paginated result set.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Number of results to return per page.
      - in: query
        name: search
        schema:
          type: string
        description: 'Search across fields: name, code, email'
      - in: query
        name: select_limit
        schema:
          type: integer
        description: 'Limit the number of results for select requests (default: 10)'
      - in: query
        name: selected_ids
        schema:
          type: string
        description: Alias for 'ids' (Bulk Selection)
      - in: query
        name: update
        schema:
          type: boolean
        description: Return create/update serializer (for update form display)
      tags:
      - Company
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanySerializerSingleResponse'
          description: Success response with single object
        '404':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Company not found
          description: Resource not found
    post:
      operationId: admin_companies_create
      description: |-
        Create a new company record.

        Validation: validate_create() hook will be called before processing.

        ---

        ## ⚙️ View Configuration

        **View ID:** `CORE_COMPANY_MGMT`
      summary: POST Company
      tags:
      - Company
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompanyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompanyRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanySerializerSingleResponse'
          description: Created successfully
        '422':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Validation failed
                  details:
                    type: object
                    properties:
                      errors:
                        type: object
                        additionalProperties:
                          type: array
                          items:
                            type: string
                        example:
                          field_name:
                          - This field is required.
                          email:
                          - Enter a valid email address.
          description: Validation failed
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: No data in request
                  details:
                    type: object
                    properties:
                      error:
                        type: string
          description: Bad request (no data provided)
        '500':
