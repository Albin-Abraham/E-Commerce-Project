apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: saas
spec:
  template:
    spec:
      containers:
      - name: migrate
        image: registry/backend-restful:latest
        command: ["python", "manage.py", "migrate"]
        envFrom:
          - secretRef:
              name: saas-secrets
      restartPolicy: Never
